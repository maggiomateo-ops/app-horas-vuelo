name: 2E.7 cutover snapshot preflight
on:
  push:
    branches: [etapa-2e4-test-app-parity]
    paths: [.github/workflows/2e7-cutover-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Generate read-only Production Sheets snapshot
        env:
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON }}
        run: npm run migration:lv-mhz:cutover-snapshot
