name: 2E2 Lock Sync

on:
  push:
    branches:
      - etapa-2e2-postgres-repositories
    paths:
      - .github/workflows/2e2-lock-sync.yml

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Generate package-lock from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lock contains exact pg runtime dependency
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages?.['']?.dependencies?.pg !== '8.23.0' || l.packages?.['node_modules/pg']?.version !== '8.23.0') process.exit(1)"

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: root-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
