name: 2E2 Lock Sync

on:
  push:
    branches:
      - etapa-2e2-postgres-repositories
    paths:
      - .github/workflows/2e2-lock-sync.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: etapa-2e2-postgres-repositories

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Generate package-lock from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lock contains exact pg runtime dependency
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages?.['']?.dependencies?.pg !== '8.23.0' || l.packages?.['node_modules/pg']?.version !== '8.23.0') process.exit(1)"

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "2E.2: sync root pg runtime lockfile"
          git push origin HEAD:etapa-2e2-postgres-repositories
